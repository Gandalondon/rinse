name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rinse.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/rinse.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret set: using a one-off debug key, so updates will need a reinstall."
          fi

      # The runner image already includes the Android SDK.
      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          HC_CLIENT_ID: ${{ secrets.HC_CLIENT_ID }}
          HC_CLIENT_SECRET: ${{ secrets.HC_CLIENT_SECRET }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Surface compile errors as annotations, readable without opening the log.
      - name: Report errors
        if: failure()
        run: grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | sed 's/^/::error::/' || true

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Rinse.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rinse ${{ github.run_number }}
          make_latest: true
          files: Rinse.apk
